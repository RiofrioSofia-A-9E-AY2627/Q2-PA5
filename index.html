<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link rel="stylesheet" href="style.css">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container bg-secondary p-3">

        <form action="" method="post">

            <h2>Custom Sneaker Order Form</h2>

            <label for="form-name" class="form-label mt-2">Name:</label>
            <input type="text" name="username" id="form-name" class="textinput form-control">

            <label for="form-email" class="form-label mt-2">Email:</label>
            <input type="email" name="emailaddress" id="form-email" class="textinput form-control">

            <label for="form-tel" class="form-label mt-2">Telephone:</label>
            <input type="tel" name="telephone" id="form-tel" class="textinput form-control">

            <label for="form-story class=form-label">Tell us about yourself:</label>
            <textarea name="story" maxlength="600" id="form-story"
                placeholder="No more than 600 characters long class=textinput form-control"></textarea>

            <label for="sizes">Size:</label>
            <select class="form-select" name="size" id="sizes">
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
            </select>

            <em>Sizes reflect standard US men's sizes</em>

            <label for="colors">Sneaker Color:</label>
            <fieldset id="colors">
                <legend>Color</legend>

                <div class="form-check">
                    <label class="form-check-label">
                        <input type="radio" name="color" value="red" class="form-check-input"> Red
                    </label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label">
                        <input type="radio" name="color" value="Blue" class="form-check-input"> Blue
                    </label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label">
                        <input type="radio" name="color" value="Black" class="form-check-input"> Black
                    </label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label">
                        <input type="radio" name="color" value="Silver" class="form-check-input"> Silver
                    </label>
                </div>
               
            </fieldset>

            <label for="features">Add-on Features:</label>
            <fieldset id="features">
                <legend>Feature</legend>
                <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
                <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
                <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
                <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
            </fieldset>

            <input type="submit" value="ENTER">
        </form>

    </div>
</body>

</html>
